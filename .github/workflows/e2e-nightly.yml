name: E2E (nightly)

# Playwright + Aspire end-to-end suite. NOT a PR gate: it boots all 5 services
# via .NET Aspire against a Postgres testcontainer and drives headless Chromium,
# which is slow (20-40 min) and historically flaky headless (see MEMORY: E2E
# headless combobox flakiness). Runs on a schedule so regressions are still
# caught within a day, and on demand.

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  E2E_TESTING: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore OneBigTeam.slnx --locked-mode

      # The committed xunit.runner.json pins maxParallelThreads=15 — that is the local/dev
      # reliability contract (MEMORY: "E2E must be deterministic at 15 threads") and must NOT be
      # forked permanently. But this job runs on a 2-vCPU ubuntu-latest runner that is ALSO booting
      # the full 5-service Aspire graph + a Postgres testcontainer. 15 headless Chromium under that
      # CPU starvation makes HR.Web's HttpClient calls to HR.Api time out, surfacing as bogus
      # "Something went wrong. Please try again." login failures. We patch the runner config down to
      # 6 in-place for this CI run only (not committed, and before build so it is copied to bin/).
      - name: Throttle E2E parallelism for the 2-core runner
        shell: bash
        run: |
          set -euo pipefail
          cfg=tests/HR.Web.E2E.Tests/xunit.runner.json
          jq '.maxParallelThreads = 6' "$cfg" > "$cfg.tmp"
          mv "$cfg.tmp" "$cfg"
          cat "$cfg"

      - name: Build E2E project (Release)
        run: dotnet build tests/HR.Web.E2E.Tests/HR.Web.E2E.Tests.csproj -c Release --no-restore

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          pw=$(find tests/HR.Web.E2E.Tests -name 'playwright.ps1' | head -n1)
          pwsh "$pw" install --with-deps chromium

      - name: Run E2E tests
        run: >
          dotnet test tests/HR.Web.E2E.Tests/HR.Web.E2E.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=e2e.trx"

      - name: Restore xunit.runner.json (avoid leaking the CI throttle)
        if: always()
        run: git checkout -- tests/HR.Web.E2E.Tests/xunit.runner.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: ignore

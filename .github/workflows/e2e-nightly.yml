name: E2E (nightly)

# Playwright + Aspire end-to-end suite. NOT a PR gate: it boots all 5 services
# via .NET Aspire against a Postgres testcontainer and drives headless Chromium,
# which is slow (20-40 min) and historically flaky headless (see MEMORY: E2E
# headless combobox flakiness). Runs on a schedule so regressions are still
# caught within a day, and on demand.

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  E2E_TESTING: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore OneBigTeam.slnx --locked-mode

      - name: Build E2E project (Release)
        run: dotnet build tests/HR.Web.E2E.Tests/HR.Web.E2E.Tests.csproj -c Release --no-restore

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          pw=$(find tests/HR.Web.E2E.Tests -name 'playwright.ps1' | head -n1)
          pwsh "$pw" install --with-deps chromium

      # The E2E database is recreated for every run, so use a fresh data-protection
      # key. The Syncfusion licence remains a repository secret and is never logged.
      - name: Configure E2E secrets
        shell: bash
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: |
          if [[ -z "$SYNCFUSION_LICENSE_KEY" ]]; then
            echo "::error::Repository secret SYNCFUSION_LICENSE_KEY is required for browser tests."
            exit 1
          fi
          echo "Infrastructure__SensitiveDataProtection__ActiveKeyId=ci" >> "$GITHUB_ENV"
          echo "Infrastructure__SensitiveDataProtection__Keys__ci=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "Syncfusion__LicenseKey=$SYNCFUSION_LICENSE_KEY" >> "$GITHUB_ENV"

      - name: Run E2E tests
        shell: bash
        env:
          E2E_DIAG_DIR: ${{ github.workspace }}/e2e-diag
        run: |
          mkdir -p "$E2E_DIAG_DIR"
          dotnet test tests/HR.Web.E2E.Tests/HR.Web.E2E.Tests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=e2e.trx" \
            --logger "console;verbosity=normal" 2>&1 | tee "$E2E_DIAG_DIR/dotnet-test-console.log"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: ignore

      # E2eDiag output, readiness/startup-migrations responses, Aspire resource state and logs,
      # resource sampling and the full test console log. Runs on success, failure and cancel.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-diagnostics
          path: e2e-diag/
          if-no-files-found: ignore

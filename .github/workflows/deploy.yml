name: Deploy (reusable)

# Reusable, environment-parameterised deployment to Railway.
# Thin wrappers call this: deploy-test.yml, deploy-staging.yml, deploy-production.yml.
# All approval / protection is enforced by the GitHub Environment named here
# (see docs/runbooks/deployment-pipeline.md section "GitHub Environments").

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment + Railway environment name (test | staging | production)
        required: true
        type: string
      railway_environment:
        description: Railway environment slug if it differs from `environment`
        required: false
        type: string
        default: ""
      ref:
        description: Git ref (branch, tag or SHA) to deploy. Defaults to the triggering commit.
        required: false
        type: string
        default: ""
      run_migrations_check:
        description: Gate the rollout on /health/startup-migrations after deploy
        required: false
        type: boolean
        default: true
    secrets:
      RAILWAY_TOKEN:
        description: Railway project token scoped to the target environment
        required: true
      API_HEALTH_BEARER_TOKEN:
        description: Optional bearer token for the startup-migrations health probe
        required: false

concurrency:
  # Never run two deploys to the same environment at once.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # ----------------------------------------------------------------
  # Hard gate: the commit being deployed must have a green CI run.
  # This is what "prevent deployment when mandatory quality gates
  # fail" means in practice.
  # ----------------------------------------------------------------
  quality-gate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - id: resolve
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking CI status for $SHA"
          conclusion=$(gh run list --workflow=ci.yml --commit "$SHA" \
            --json conclusion,status,headSha \
            --jq '[.[] | select(.headSha == env.SHA)] | first | .conclusion' || echo "")
          echo "Latest CI conclusion: '${conclusion:-<none>}'"
          if [ "$conclusion" != "success" ]; then
            echo "::error::No successful CI run found for $SHA. Refusing to deploy."
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: quality-gate
    # GitHub Environment protection rules (required reviewers, wait timer,
    # deployment branch filter) are applied here. `production` MUST have
    # "Required reviewers" configured - see the runbook.
    environment:
      name: ${{ inputs.environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DEPLOY_SHA: ${{ needs.quality-gate.outputs.sha }}
      RAILWAY_ENV: ${{ inputs.railway_environment || inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality-gate.outputs.sha }}

      - name: Record deployment start (GitHub Deployments API)
        id: ghdeploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/deployments" \
            -f ref="$DEPLOY_SHA" \
            -f environment="${{ inputs.environment }}" \
            -f description="Deploy by ${GITHUB_ACTOR} via run ${GITHUB_RUN_ID}" \
            -F auto_merge=false -F required_contexts='[]' \
            --jq '.id')
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/$id/statuses" \
            -f state=in_progress -f description="Railway deploy started" >/dev/null

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Capture current Railway deployment (rollback anchor)
        shell: bash
        run: |
          set -euo pipefail
          # Best-effort: store the currently-live deployment id so we can roll back to it.
          railway status --environment "$RAILWAY_ENV" --json > railway-before.json || true
          cat railway-before.json || true

      - name: Deploy services to Railway
        shell: bash
        run: |
          set -euo pipefail
          # One Railway project, one service per component. `--detach` returns once the
          # build is queued; the readiness gate below is what actually confirms success.
          for svc in marketing app api admin admin-api; do
            echo "==== railway up: $svc ===="
            railway up --service "$svc" --environment "$RAILWAY_ENV" --ci --detach
          done

      - name: Wait for API readiness (/health/ready)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(10)
          do {
            try {
              $r = Invoke-WebRequest -Uri "$env:API_BASE_URL/health/ready" -TimeoutSec 15 -SkipHttpErrorCheck
              Write-Host "readiness: $($r.StatusCode)"
              if ($r.StatusCode -eq 200) { exit 0 }
            } catch { Write-Host "readiness probe failed: $($_.Exception.Message)" }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)
          Write-Error "API did not become ready within 10 minutes."
          exit 1

      - name: Verify startup migrations
        if: inputs.run_migrations_check
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          API_BEARER_TOKEN: ${{ secrets.API_HEALTH_BEARER_TOKEN }}
        shell: pwsh
        run: |
          ./.github/scripts/check-startup-migrations.ps1 `
            -ApiBaseUrl "$env:API_BASE_URL" `
            -BearerToken "$env:API_BEARER_TOKEN" `
            -MaxAttempts 20 -DelaySeconds 6

      - name: Rollback on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Deploy verification failed - rolling back $RAILWAY_ENV to the previous release."
          for svc in marketing app api admin admin-api; do
            railway redeploy --service "$svc" --environment "$RAILWAY_ENV" --yes || \
              echo "::error::Automatic rollback of $svc failed - follow the manual rollback procedure in docs/runbooks/deployment-pipeline.md"
          done

      - name: Record deployment outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          [ "$OUTCOME" = "success" ] && state=success
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${{ steps.ghdeploy.outputs.deployment_id }}/statuses" \
            -f state="$state" \
            -f description="environment=${{ inputs.environment }} actor=${GITHUB_ACTOR} sha=${DEPLOY_SHA} outcome=${OUTCOME}" >/dev/null
          {
            echo "## Deployment"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Git SHA | \`${DEPLOY_SHA}\` |"
            echo "| Actor | ${GITHUB_ACTOR} |"
            echo "| Run | ${GITHUB_RUN_ID} |"
            echo "| Outcome | ${OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"

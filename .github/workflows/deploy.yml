name: Deploy (reusable)

# Reusable, environment-parameterised deployment to Railway.
# Thin wrappers call this: deploy-test.yml, deploy-staging.yml, deploy-production.yml.
# All approval / protection is enforced by the GitHub Environment named here
# (see docs/runbooks/deployment-pipeline.md section "GitHub Environments").
#
# Ticket 5: the deploy job is a single verified-deploy + recovery controller
# (.github/scripts/deploy/). It deploys every required service from ONE immutable git SHA, captures
# the previous known-good deployment per service, waits (bounded) for each new deployment and
# verifies its release identity by EXACT sha match against GET /health/release, verifies API
# readiness + startup migrations against the NEW sha, handles partial rollout explicitly, and on any
# verification failure restores the recorded known-good deployments (bounded) and re-verifies — or,
# when release-safety.json marks the release migration-incompatible, refuses automatic application
# rollback and prints actionable manual recovery instructions.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment + Railway environment name (test | staging | production)
        required: true
        type: string
      railway_environment:
        description: Railway environment slug if it differs from `environment`
        required: false
        type: string
        default: ""
      ref:
        description: Git ref (branch, tag or SHA) to deploy. Defaults to the triggering commit.
        required: false
        type: string
        default: ""
      run_migrations_check:
        description: Gate the rollout on /health/startup-migrations (against the new sha) after deploy
        required: false
        type: boolean
        default: true
      rollout_timeout_seconds:
        description: Bounded wait for every service to report the new release identity
        required: false
        type: number
        default: 900
      recovery_timeout_seconds:
        description: Bounded wait for every service to report the restored known-good identity
        required: false
        type: number
        default: 600
    secrets:
      RAILWAY_TOKEN:
        description: Railway project token scoped to the target environment
        required: true
      API_HEALTH_BEARER_TOKEN:
        description: Optional bearer token for the startup-migrations health probe
        required: false

concurrency:
  # Never run two deploys to the same environment at once.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # ----------------------------------------------------------------
  # Hard gate: the commit being deployed must have a green CI run.
  # ----------------------------------------------------------------
  quality-gate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Deterministic build label injected as PLATFORM_VERSION on every service (Railway's
          # Nixpacks build does not stamp the assembly, so /health/release relies on this + RELEASE_SHA).
          echo "version=1.0.${{ github.run_number }}+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking CI status for $SHA"
          conclusion=$(gh run list --workflow=ci.yml --commit "$SHA" \
            --json conclusion,status,headSha \
            --jq '[.[] | select(.headSha == env.SHA)] | first | .conclusion' || echo "")
          echo "Latest CI conclusion: '${conclusion:-<none>}'"
          if [ "$conclusion" != "success" ]; then
            echo "::error::No successful CI run found for $SHA. Refusing to deploy."
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: quality-gate
    # GitHub Environment protection rules (required reviewers, wait timer, deployment branch filter)
    # are applied here. `production` MUST have "Required reviewers" configured - see the runbook.
    environment:
      name: ${{ inputs.environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DEPLOY_SHA: ${{ needs.quality-gate.outputs.sha }}
      DEPLOY_VERSION: ${{ needs.quality-gate.outputs.version }}
      RAILWAY_ENV: ${{ inputs.railway_environment || inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.quality-gate.outputs.sha }}
          fetch-depth: 0

      - name: Record deployment start (GitHub Deployments API)
        id: ghdeploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/deployments" \
            -f ref="$DEPLOY_SHA" \
            -f environment="${{ inputs.environment }}" \
            -f description="Deploy by ${GITHUB_ACTOR} via run ${GITHUB_RUN_ID}" \
            -F auto_merge=false -F required_contexts='[]' \
            --jq '.id')
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/$id/statuses" \
            -f state=in_progress -f description="Railway verified deploy started" >/dev/null

      - name: Warn if migrations changed but release-safety.json was not touched
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          [ -z "$base" ] && { echo "No parent commit to diff; skipping."; exit 0; }
          changed=$(git diff --name-only "$base" HEAD || true)
          if echo "$changed" | grep -Eq 'Persistence/Migrations/.*\.cs$'; then
            if ! echo "$changed" | grep -q '.github/scripts/deploy/release-safety.json'; then
              echo "::warning::This release changes EF migration files but does not touch \
          .github/scripts/deploy/release-safety.json. If any change is contracting/destructive \
          (DROP/RENAME COLUMN, NOT NULL tightening), set appRollbackSafe=false in that file so the \
          pipeline does not attempt an unsafe automatic application rollback. See \
          docs/runbooks/deployment-pipeline.md section 5."
            fi
          fi

      - name: Install Railway CLI
        # Pinned (Ticket 5 follow-up). Historical restore no longer relies on the CLI — it uses the
        # Railway GraphQL API `deploymentRollback` mutation — but the CLI is still used for
        # `railway status --json` (project/service/environment id discovery), `railway variables
        # --set ... --skip-deploys` (needs >= 3.5) and `railway up`. Bump deliberately and re-run
        # the live demonstrations in docs/tickets/ticket-5-verified-releases-and-recovery.md.
        run: npm i -g @railway/cli@5.52.0

      - name: Verified deploy + recovery
        env:
          MIGRATION_BEARER_TOKEN: ${{ secrets.API_HEALTH_BEARER_TOKEN }}
          # Public base URLs per environment (docs/runbooks/deployment-pipeline.md section 4).
          # admin-api is intentionally omitted until the HR.Admin.Api host exists.
          SERVICE_URLS: |
            {
              "api": "${{ vars.API_BASE_URL }}",
              "app": "${{ vars.APP_BASE_URL }}",
              "marketing": "${{ vars.MARKETING_BASE_URL }}",
              "admin": "${{ vars.ADMIN_BASE_URL }}"
            }
        shell: pwsh
        run: |
          ./.github/scripts/deploy/Invoke-VerifiedDeploy.ps1 `
            -Environment "$env:RAILWAY_ENV" `
            -TargetSha "$env:DEPLOY_SHA" `
            -Version "$env:DEPLOY_VERSION" `
            -ServiceUrlsJson "$env:SERVICE_URLS" `
            -RolloutTimeoutSeconds ${{ inputs.rollout_timeout_seconds }} `
            -RecoveryTimeoutSeconds ${{ inputs.recovery_timeout_seconds }} `
            -MigrationBearerToken "$env:MIGRATION_BEARER_TOKEN" `
            -RunMigrationsCheck ([bool]::Parse("${{ inputs.run_migrations_check }}"))

      - name: Record deployment outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          [ "$OUTCOME" = "success" ] && state=success
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${{ steps.ghdeploy.outputs.deployment_id }}/statuses" \
            -f state="$state" \
            -f description="environment=${{ inputs.environment }} actor=${GITHUB_ACTOR} sha=${DEPLOY_SHA} outcome=${OUTCOME}" >/dev/null
          {
            echo "## Deployment"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Git SHA | \`${DEPLOY_SHA}\` |"
            echo "| Actor | ${GITHUB_ACTOR} |"
            echo "| Run | ${GITHUB_RUN_ID} |"
            echo "| Outcome | ${OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"

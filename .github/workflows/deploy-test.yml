name: Deploy - Test

# Auto-deploys every green commit on main to the Test environment, and can be
# run on demand for any ref. No approval gate (see the GitHub Environment "test").

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (default - latest main)
        required: false
        default: ""

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: test
      ref: ${{ inputs.ref || '' }}
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TEST }}
      API_HEALTH_BEARER_TOKEN: ${{ secrets.API_HEALTH_BEARER_TOKEN_TEST }}

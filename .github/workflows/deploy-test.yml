name: Deploy - Test

# Deploy automatically only after CI finishes successfully.
# Manual deployment remains available from the Actions screen.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (default - latest main)
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    uses: ./.github/workflows/deploy.yml

    with:
      environment: test
      ref: >-
        ${{ github.event_name == 'workflow_run'
            && github.event.workflow_run.head_sha
            || inputs.ref
            || '' }}

    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TEST }}
      API_HEALTH_BEARER_TOKEN: ${{ secrets.API_HEALTH_BEARER_TOKEN_TEST }}
name: Accessibility (nightly)

# NFR-05 automated accessibility quality gate.
#
# Runs the axe-core WCAG 2.1 AA scans, keyboard-only journey tests, dialog
# focus-management assertions and validation-announcement checks that live in
# HR.Web.E2E.Tests. Like e2e-nightly.yml this boots the full 5-service Aspire
# stack against a Postgres testcontainer and drives headless Chromium, so it is
# NOT a PR gate - the PR gate only compiles the E2E project (ci.yml -> e2e-compile).
# It runs on a schedule so accessibility regressions are still caught within a day.
#
# Serious + critical WCAG violations fail the build: AccessibilityScan
# .AssertNoSeriousViolationsAsync throws, which fails the test, which fails this job.

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC daily (after e2e-nightly at 03:00)
  workflow_dispatch:

concurrency:
  group: a11y-nightly
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  E2E_TESTING: "true"

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore OneBigTeam.slnx --locked-mode

      - name: Build E2E project (Release)
        run: dotnet build tests/HR.Web.E2E.Tests/HR.Web.E2E.Tests.csproj -c Release --no-restore

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          pw=$(find tests/HR.Web.E2E.Tests -name 'playwright.ps1' | head -n1)
          pwsh "$pw" install --with-deps chromium

      - name: Run accessibility tests
        run: >
          dotnet test tests/HR.Web.E2E.Tests/HR.Web.E2E.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~AxeCoreDashboardScanTests|FullyQualifiedName~AccessibilityScanJourneyTests|FullyQualifiedName~EmployeeSelfServiceAccessibilityScanTests|FullyQualifiedName~LoginAccessibilityScanTests|FullyQualifiedName~KeyboardJourneyTests|FullyQualifiedName~KeyboardAuthJourneyTests|FullyQualifiedName~DialogFocusManagementTests|FullyQualifiedName~ValidationAnnouncementTests|FullyQualifiedName~ReportChartAccessibilityTests|FullyQualifiedName~DashboardAccessibilityTests"
          --logger "trx;LogFileName=a11y.trx"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: ignore

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#021C32"/>
  
  <!-- Logo Mark -->
  <g transform="translate(10, 0)">
    <!-- 4 Overlapping rings creating the interlocking bodies -->
    <circle cx="50" cy="33" r="12" fill="none" stroke="#00C9A3" stroke-width="6"/>
    <circle cx="50" cy="67" r="12" fill="none" stroke="#00C9A3" stroke-width="6"/>
    <circle cx="33" cy="50" r="12" fill="none" stroke="#00C9A3" stroke-width="6"/>
    <circle cx="67" cy="50" r="12" fill="none" stroke="#00C9A3" stroke-width="6"/>

    <!-- 4 Outer dots representing the heads of the team members -->
    <circle cx="50" cy="12" r="3.5" fill="#00C9A3"/>
    <circle cx="50" cy="88" r="3.5" fill="#00C9A3"/>
    <circle cx="12" cy="50" r="3.5" fill="#00C9A3"/>
    <circle cx="88" cy="50" r="3.5" fill="#00C9A3"/>

    <!-- Central connecting dot -->
    <circle cx="50" cy="50" r="3.5" fill="#00C9A3"/>
  </g>

  <!-- Typography -->
  <text 
    x="120" 
    y="54" 
    dominant-baseline="middle" 
    font-family="'Montserrat', 'Proxima Nova', 'Inter', system-ui, -apple-system, sans-serif" 
    font-weight="700" 
    font-size="36" 
    fill="#ffffff">
    One Big Team
  </text>
</svg>
